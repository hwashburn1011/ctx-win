# Configuration for the non-Reddit ingest sources.

youtube:
  max_video_minutes: 60          # skip uploads longer than this
  whisper_model: base            # faster-whisper size for caption-less videos
                                 # (tiny | base | small | medium)
  languages: ["en.*"]            # caption language patterns for yt-dlp
  player_clients: [web_safari, android_vr]
                                 # yt-dlp YouTube player clients to try, in
                                 # order. These reach YouTube where the default
                                 # `web` client is bot-blocked (datacenter /
                                 # shared IPs). Others: tv, ios, mweb.
  proxy: ""                      # optional. If yt-dlp itself is blocked, route
                                 # its requests through a (residential) proxy.
                                 # Leave blank to fetch directly. Example:
                                 #   proxy: "http://user:pass@host:port"

hackernews:
  min_points: 100                # Algolia `points>` filter
  max_comments: 15               # top-level comments fetched per story
  keywords:                      # whole-word match against story title + url
    - AI
    - LLM
    - Claude
    - GPT
    - ChatGPT
    - Anthropic
    - OpenAI
    - Gemini
    - Llama
    - Grok
    - Mistral
    - agent
    - agentic
    - model
    - machine learning
    - diffusion
    - transformer

arxiv:
  categories: [cs.AI, cs.CL, cs.LG]
  page_size: 100                 # results per API request
  max_pages: 20                  # safety cap (page_size * max_pages entries)

# Blog / RSS feeds -- AI leaders and practitioners. Ingested by ingest/rss.py.
# A feed that fails to load is logged and skipped.
rss:
  feeds:
    - name: Simon Willison
      url: https://simonwillison.net/atom/everything/
    - name: Geoffrey Huntley
      url: https://ghuntley.com/rss/
    - name: Andrej Karpathy
      url: https://karpathy.github.io/feed.xml
    - name: OpenAI
      url: https://openai.com/blog/rss.xml
    # Steve Yegge has no verified current feed -- add here if you have one.
